math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: qwen3_30ba3b_instruct_2507_model_server
      # Cap the judge's generation. The judge only needs to emit brief reasoning
      # plus an equivalence verdict ([[A=B]] / [[A!=B]]), but the judge model has
      # uses_reasoning_parser=true and no output cap, so a scoring request can run
      # away generating up to max_model_len (32768). That makes the judge call
      # extremely slow and the (aborted/over-long) response shows up to the client
      # as `ClientPayloadError: Response payload is not completed`, which the
      # rollout agent retries and ultimately hangs on. Bound it.
      judge_responses_create_params: {
        input: [],
        max_output_tokens: 4096
      }
      should_use_judge: true
      domain: math
      verified: false
      description: DAPO17k math dataset with math-verify
      value: Improve math capabilities including AIME 24 / 25
math_with_judge_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/math_with_judge/data/dapo17k_train.jsonl
        # From YouJiacheng/DAPO-Math-17k-dedup
        gitlab_identifier:
          dataset_name: dapo17k
          version: 0.0.1
          artifact_fpath: dapo17k_train.jsonl
        license: Apache 2.0
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/math_with_judge/data/aime24_validation.jsonl
        gitlab_identifier:
          dataset_name: aime24
          version: 0.0.1
          artifact_fpath: aime24.jsonl
        license: Apache 2.0
        num_repeats: 32  # mean@32
qwen3_30ba3b_instruct_2507_model_server:
  responses_api_models:
    local_vllm_model:
      entrypoint: app.py
      model: Qwen/Qwen3-30B-A3B-Instruct-2507
      return_token_id_information: false
      uses_reasoning_parser: true
      debug: false

      # For example, if your model is downloaded at ~/.cache/huggingface/hub/models--Qwen--Qwen3-235B-A22B-Instruct-2507, your hf_home here would be `~/.cache/huggingface`
      hf_home: null

      vllm_serve_env_vars:
        # If your tp * pp is greater than one node or one model instance spans more than one node, set this to `span`!
        VLLM_RAY_DP_PACK_STRATEGY: strict

      # If a hf_token is present in the env.yaml, it will be prepended to the hf download.
      vllm_serve_kwargs:
        # vLLM serving is a bit quirky at the moment. These parallelism configs are fairly sensitive and need to always be set properly!
        # NOTE: DP>1 does NOT work here. For an MoE model vLLM's data-parallel
        # engine (DPMoEEngineCoreActor) shards experts with expert parallelism
        # across all DP*TP ranks, so DP=2*TP=2 makes the per-rank MoE
        # intermediate 768/4=192 (192 % 128 = 64) and the Blackwell flashinfer
        # trtllm_bf16_moe kernel rejects it (same failure as TP=4). Keep DP=1.
        data_parallel_size: 1
        data_parallel_size_local: 1
        # Qwen3-30B-A3B moe_intermediate_size=768. The Blackwell flashinfer
        # trtllm_bf16_moe kernel requires the per-shard intermediate size to be
        # a multiple of 128, so TP must divide 768 into a multiple of 128.
        # TP=4 -> 192 (192 % 128 = 64) fails; TP=2 -> 384 (384 % 128 = 0) works.
        tensor_parallel_size: 2
        pipeline_parallel_size: 1

        # The judge only scores math answers; it does NOT need the model's full
        # 262144 (256k) context. Defaulting to 262144 makes vLLM init take ~13
        # min (huge KV-cache profiling + warmup), and during that window the
        # gym-assigned responses-API port gets stolen by churning client retry
        # sockets -> "[Errno 98] address already in use" -> the judge never
        # binds and is stuck at 3/4 ready. Cap it so the judge starts in ~1-2
        # min and binds its port promptly. 32768 leaves headroom for the
        # problem + a full-length (up to ~16k-token) candidate solution + the
        # judge rubric/verdict without truncating, while still being ~8x smaller
        # than 262144.
        max_model_len: 32768

        gpu_memory_utilization: 0.9
        enable_auto_tool_choice: true
        tool_call_parser: hermes
